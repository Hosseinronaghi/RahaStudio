name: Build Raha Studio Android v1.3

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: raha-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 80

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "cmake;3.22.1"

      - name: Generate clean Android scaffold
        run: |
          rm -rf android .dart_tool build
          flutter create . \
            --platforms=android \
            --org com.rahastudio \
            --project-name raha_studio \
            --no-pub

      - name: Configure Android and security
        run: |
          chmod +x tool/configure_android.sh
          ./tool/configure_android.sh

      - name: Configure optional release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RAHA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RAHA_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RAHA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RAHA_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/raha-release.jks
            {
              echo "RAHA_STORE_FILE=raha-release.jks"
              echo "RAHA_STORE_PASSWORD=$STORE_PASSWORD"
              echo "RAHA_KEY_ALIAS=$KEY_ALIAS"
              echo "RAHA_KEY_PASSWORD=$KEY_PASSWORD"
            } >> android/gradle.properties
            echo "SIGNED_RELEASE=true" >> "$GITHUB_ENV"
          else
            echo "SIGNED_RELEASE=false" >> "$GITHUB_ENV"
            echo "::warning::Release signing secrets are absent. APK will use the Android debug certificate and may trigger low-reputation warnings."
          fi

      - name: Resolve dependencies
        run: |
          rm -f pubspec.lock
          flutter pub get
          flutter pub deps --style=compact

      - name: Security sanity checks
        run: |
          ! grep -R "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml
          ! grep -R "READ_EXTERNAL_STORAGE\|WRITE_EXTERNAL_STORAGE\|MANAGE_EXTERNAL_STORAGE" android/app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'applicationId = "com.rahastudio.app"' android/app/build.gradle.kts

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Build universal release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build release AAB
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            build/app/outputs/flutter-apk/app-release.apk \
            > signature-report.txt
          cat signature-report.txt

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/
          cp build/app/outputs/bundle/release/app-release.aab dist/
          cp signature-report.txt dist/
          printf "signed_release=%s\n" "$SIGNED_RELEASE" > dist/BUILD-TRUST.txt
          sha256sum dist/*.apk dist/*.aab > dist/SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Raha-Studio-v1.3-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
