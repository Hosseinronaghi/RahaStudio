name: Build Raha Studio Android v1.1

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: raha-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze, test and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Install Android SDK 36
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "cmake;3.22.1"

      - name: Generate modern Android scaffold
        run: |
          rm -rf android
          flutter create . \
            --platforms=android \
            --org com.rahastudio \
            --project-name raha_studio \
            --no-pub

      - name: Configure Android API levels
        run: |
          chmod +x tool/configure_android.sh
          ./tool/configure_android.sh
          echo "---- app build.gradle.kts ----"
          sed -n '1,220p' android/app/build.gradle.kts
          echo "---- gradle.properties ----"
          cat android/gradle.properties

      - name: Resolve dependencies
        run: |
          rm -rf .dart_tool pubspec.lock
          flutter pub get

      - name: Dependency summary
        run: flutter pub deps --style=compact

      - name: Verify Android API configuration
        run: |
          grep -R "compileSdk" android/app/build.gradle.kts android/build.gradle.kts
          ./android/gradlew -p android projects

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Build universal release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build split release APKs
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: Build release AAB
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Collect outputs
        run: |
          mkdir -p dist
          find build/app/outputs -type f \( -name "*.apk" -o -name "*.aab" \) \
            -exec cp {} dist/ \;
          sha256sum dist/* > dist/SHA256SUMS.txt
          ls -lah dist

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Raha-Studio-Android-v1-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
