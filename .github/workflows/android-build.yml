name: Build Raha Studio Android v1.2

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: raha-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze, test, and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "cmake;3.22.1"

      - name: Generate Android scaffold
        run: |
          rm -rf android .dart_tool build
          flutter create . \
            --platforms=android \
            --org com.rahastudio \
            --project-name raha_studio \
            --no-pub

      - name: Configure and verify Android project
        run: |
          chmod +x tool/configure_android.sh
          ./tool/configure_android.sh
          grep -nE "compileSdk|targetSdk|minSdk" android/app/build.gradle.kts
          sed -n '1,80p' android/app/src/main/kotlin/com/rahastudio/raha_studio/MainActivity.kt

      - name: Resolve dependencies
        run: |
          rm -f pubspec.lock
          flutter pub get
          flutter pub deps --style=compact

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Build universal release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build split release APKs
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: Build release AAB
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Collect outputs
        if: success()
        run: |
          mkdir -p dist
          find build/app/outputs -type f \( -name "*.apk" -o -name "*.aab" \) \
            -exec cp {} dist/ \;
          sha256sum dist/* > dist/SHA256SUMS.txt
          ls -lah dist

      - name: Upload Android artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Raha-Studio-Android-v1.2-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Raha-Studio-build-diagnostics-${{ github.run_number }}
          path: |
            pubspec.yaml
            pubspec.lock
            android/app/build.gradle.kts
            android/build.gradle.kts
            android/settings.gradle.kts
            android/gradle.properties
            android/app/src/main/kotlin/com/rahastudio/raha_studio/MainActivity.kt
          if-no-files-found: warn
          retention-days: 7
